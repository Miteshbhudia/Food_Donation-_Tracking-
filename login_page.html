    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Show/Hide Password Feature
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('loginPassword');
            const icon = document.getElementById('toggleIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                pwdInput.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        // URL Alert Parameter Handler
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const errorParam = urlParams.get('error');
            const logoutParam = urlParams.get('logout');
            const signupParam = urlParams.get('signup');

            if (errorParam === 'concurrent') {
                showAlert('Session terminated: This account was accessed from another tab or browser.', 'warning');
            } else if (errorParam === 'timeout') {
                showAlert('Session expired due to 15 minutes of inactivity. Please sign in again.', 'info');
            } else if (errorParam === 'unauthorized') {
                showAlert('Access denied. Please log in to continue.', 'danger');
            } else if (errorParam === 'invalid') {
                showAlert('Invalid credentials. Please verify your details.', 'danger');
            } else if (errorParam === 'empty') {
                showAlert('Please fill in both email and password.', 'warning');
            } else if (logoutParam === 'success') {
                showAlert('You have been logged out safely.', 'success');
            } else if (signupParam === 'success') {
                showAlert('Registration successful! Please log in.', 'success');
            }
        });

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer') || document.querySelector('.auth-header');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} compact-alert alert-dismissible fade show text-start d-flex align-items-center mb-3 pe-5`;
            alertDiv.role = 'alert';
            
            let iconClass = 'bi-shield-exclamation';
            if (type === 'success') iconClass = 'bi-check-circle-fill';
            if (type === 'info') iconClass = 'bi-info-circle-fill';
            if (type === 'danger') iconClass = 'bi-exclamation-triangle-fill';

            alertDiv.innerHTML = `
                <i class="bi ${iconClass} me-2 fs-6"></i>
                <span>${message}</span>
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            alertContainer.appendChild(alertDiv);
        }
    </script>
