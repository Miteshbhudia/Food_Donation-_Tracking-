    <style>
        :root {
            --primary: #16a34a;
            --primary-hover: #15803d;

            --gray-body: #64748b;

        html, body {

            margin: 0;

            overflow: hidden; /* Guarantees zero vertical scrolling */

            background-color: var(--bg-light);
            color: var(--dark);
        }

        .auth-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Streamlined Navbar */
        .auth-nav {
            background-color: #ffffff;
            border-bottom: 1px solid var(--card-border);
            padding: 0.65rem 1.5rem;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary);

        }

        .nav-links a {
            text-decoration: none;

        }
        .nav-links a.active, .nav-links a:hover {

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
            padding: 1.75rem 2rem;
        }

        .auth-header h3 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.2rem;

        }

        /* Modern Segmented Role Selector */
        .role-switch-container {
            display: flex;
            background-color: #f1f5f9;
            border-radius: 10px;

            margin-bottom: 1.15rem;

        }

            flex: 1;
            border: none;

            font-size: 0.775rem;

            color: var(--gray-body);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .role-btn.active {
            background-color: #ffffff;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
        }

        /* Form Labels & Links */
        .form-label {
            font-size: 0.775rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0;
        }

        .forgot-link {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .forgot-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .form-control {
            border: 1px solid var(--card-border);

            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
        }

        .input-group-password {
            position: relative;
        }
        .password-toggle-btn {

            z-index: 5;

        .btn-auth-submit {

            border: none;

            padding: 0.65rem;

        .auth-footer a {

<body>
    <div class="auth-layout">
        <!-- Compact Header Navigation -->
        <nav class="auth-nav d-flex align-items-center justify-content-between">
            <a href="homepage.html" class="brand-title">Food<span>Trace</span></a>
            <div class="nav-links d-flex align-items-center gap-1">
                <a href="homepage.html">Home</a>
                <a href="login_page.html" class="active">Login</a>
                <a href="reg_donor.php">Register</a>
            </div>
        </nav>

        <!-- Centered Stage -->
        <main class="auth-stage">
            <div class="auth-card">
                
                <!-- Dynamic URL Alert Toast -->
                <div id="urlAlertContainer"></div>

                <div class="auth-header text-center">
                    <h3>Welcome Back</h3>
                    <p>Select your access role to continue</p>
                </div>

                <!-- Modern Role Switcher -->
                <div class="role-switch-container">
                    <button type="button" class="role-btn active" id="btnRoleDonor" onclick="selectRole('Donor')">
                        <i class="bi bi-person me-1"></i>Donor
                    </button>
                    <button type="button" class="role-btn" id="btnRoleArea" onclick="selectRole('Area Admin')">
                        <i class="bi bi-geo-alt me-1"></i>Area Admin
                    </button>
                    <button type="button" class="role-btn" id="btnRoleSys" onclick="selectRole('System Admin')">
                        <i class="bi bi-shield-lock me-1"></i>System Admin
                    </button>
                </div>

                <form method="POST" action="authentication.php" id="loginForm">
                    <!-- Hidden Role Field to Pass Cleanly to PHP Backend -->
                    <input type="hidden" name="role" id="roleInput" value="Donor">

                    <div class="mb-2">
                        <label class="form-label mb-1" for="loginEmail">Email Address</label>
                        <input type="email" class="form-control" id="loginEmail" name="email" placeholder="name@example.com" required autofocus>
                    </div>

                    <div class="mb-2">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label" for="loginPassword">Password</label>
                            <a href="forgot_password.php" class="forgot-link" id="forgotPasswordLink">Forgot password?</a>
                        </div>
                        <div class="input-group-password">
                            <input type="password" class="form-control" id="loginPassword" name="password" placeholder="Enter your password" required>
                            <button type="button" class="password-toggle-btn" id="btnTogglePassword" onclick="togglePasswordVisibility()" aria-label="Toggle password view">
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-auth-submit" id="btnSubmit">
                        Sign In as Donor
                    </button>
                </form>

                <div class="auth-footer" id="registrationFooter">
                    <span>Don't have an account?</span> 
                    <a href="reg_donor.php">Create Donor Account</a>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Role Switching Logic
        function selectRole(roleName) {
            document.getElementById('roleInput').value = roleName;

            // Update segmented buttons
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            if (roleName === 'Donor') document.getElementById('btnRoleDonor').classList.add('active');
            if (roleName === 'Area Admin') document.getElementById('btnRoleArea').classList.add('active');
            if (roleName === 'System Admin') document.getElementById('btnRoleSys').classList.add('active');

            // Update Submit Button Text
            const submitBtn = document.getElementById('btnSubmit');
            submitBtn.textContent = `Sign In as ${roleName}`;

            // Adjust Footer Link Based on Role Architecture
            const footer = document.getElementById('registrationFooter');
            if (roleName === 'Donor') {
                footer.innerHTML = `<span>Don't have an account?</span> <a href="reg_donor.php">Create Donor Account</a>`;
            } else {
                footer.innerHTML = `<span class="text-muted"><i class="bi bi-shield-check text-success me-1"></i>Staff accounts are provisioned via System Admin.</span>`;
            }
        }

        // Show/Hide Password Feature
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('loginPassword');
            const icon = document.getElementById('toggleIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                pwdInput.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        // Automated URL Query Banner Parser
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const alertBox = document.getElementById('urlAlertContainer');

            if (params.get('logout') === 'success') {
                alertBox.innerHTML = `
                    <div class="alert alert-success compact-alert alert-dismissible fade show d-flex align-items-center" role="alert">
                        <i class="bi bi-check-circle-fill me-2 fs-6"></i>
                        <span>You have been safely logged out.</span>
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                    </div>`;
            } else if (params.get('signup') === 'success') {
                alertBox.innerHTML = `
                    <div class="alert alert-success compact-alert alert-dismissible fade show d-flex align-items-center" role="alert">
                        <i class="bi bi-check-circle-fill me-2 fs-6"></i>
                        <span>Registration successful! Please log in.</span>
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                    </div>`;
            } else if (params.get('error')) {
                alertBox.innerHTML = `
                    <div class="alert alert-danger compact-alert alert-dismissible fade show d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
                        <span>Invalid credentials. Please verify your details.</span>
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                    </div>`;
            }
        });
    </script>
</body>

</html>
